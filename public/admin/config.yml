# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Local Repository mode uses the browser's File System Access API.
# Click "Work with Local Repository" when opening /admin/ locally.
backend:
  name: github
  repo: patech-eng/patech-website-v2

site_url: https://www.patech-eng.com
logo_url: /images/brand/patech-logo.png

media_folder: /public/uploads
public_folder: /uploads
output:
  omit_empty_optional_fields: true

collections:
  - name: projects
    label: Projects
    label_singular: Project
    description: PATech factory automation, robotics, building automation (BMS), and electrical power projects.
    folder: /src/content/projects
    identifier_field: slug
    summary: "{{title}} ({{year}} · {{category}})"
    create: true
    delete: true
    media_folder: /public/uploads/projects
    public_folder: /uploads/projects
    fields:
      - { name: title, label: Project Title, widget: string, hint: "Full display title for the project." }
      - { name: slug, label: URL Slug, widget: string, hint: "Lowercase words separated by hyphens (e.g. steel-structure-welding-robot)." }
      - { name: client, label: Client / Facility Type, widget: string, required: false }
      - name: category
        label: Category
        widget: select
        options:
          - Factory Automation
          - Robotics
          - Building Automation
          - Electrical Power Solutions
      - { name: location, label: Location, widget: string, default: "Phnom Penh, Cambodia" }
      - { name: year, label: Project Year, widget: string, default: "2025" }
      - { name: scope, label: Project Scope, widget: string }
      - { name: summary, label: Short Summary, widget: text, hint: "2-3 sentence summary shown on project cards." }
      - { name: challenge, label: The Challenge, widget: text, required: false }
      - { name: solution, label: Our Solution, widget: text, required: false }
      - name: results
        label: Key Results & Deliverables
        widget: list
        required: false
        field: { name: item, label: Result, widget: string }
      - name: services
        label: Related Service Slugs
        widget: select
        multiple: true
        required: false
        options:
          - factory-automation
          - building-automation
          - electrical-power-solutions
      - { name: sortOrder, label: Display Order, widget: number, value_type: int, min: 1, step: 1, default: 1 }
      - { name: featured, label: Feature on Home Page, widget: boolean, default: true }
      - { name: draft, label: Keep as Draft, widget: boolean, default: false }
      - { name: coverImage, label: Cover Image, widget: image, hint: "Upload a new photo or reference /images/projects/..." }
      - { name: coverImageAlt, label: Cover Image Alt Text, widget: string }
      - name: gallery
        label: Project Gallery
        widget: list
        required: false
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Alt Text, widget: string }
      - { name: body, label: Case Study Details, widget: markdown }

  - name: news
    label: News & Media
    label_singular: News / Media Item
    description: Articles, technical updates, YouTube episodes, and Facebook video reels for PATech News & Media.
    folder: /src/content/news
    identifier_field: slug
    summary: "[{{contentType}}] {{title}} ({{publishedDate}})"
    create: true
    delete: true
    media_folder: /public/uploads/news
    public_folder: /uploads/news
    fields:
      - { name: title, label: Title, widget: string }
      - { name: slug, label: URL Slug, widget: string, hint: "Lowercase hyphenated slug for /news-media/<slug>." }
      - { name: summary, label: Summary / Excerpt, widget: text, hint: "Concise 2-line summary shown in the News & Media cards." }
      - name: contentType
        label: Content Type
        widget: select
        options:
          - Article
          - Video
        default: Article
      - name: source
        label: Source / Platform
        widget: select
        options:
          - PATech
          - YouTube
          - Facebook
        default: PATech
      - { name: publishedDate, label: Publish Date, widget: datetime, type: date }
      - { name: featuredImage, label: Featured / Thumbnail Image, widget: image }
      - { name: featuredImageAlt, label: Image Alt Text, widget: string }
      - { name: externalUrl, label: External Video / Post URL, widget: string, required: false, hint: "Optional link to YouTube or Facebook video." }
      - { name: embedUrl, label: Video Embed URL, widget: string, required: false, hint: "Optional iframe embed URL (e.g. https://www.youtube-nocookie.com/embed/...)." }
      - { name: linkLabel, label: External Link Label, widget: string, required: false, hint: "e.g. Watch on YouTube or Watch on Facebook" }
      - name: topics
        label: Topics / Tags
        widget: list
        required: false
        default: ["Factory Automation"]
      - { name: featured, label: Feature on Home Page, widget: boolean, default: true }
      - { name: draft, label: Keep as Draft, widget: boolean, default: false }
      - { name: body, label: Article / Video Content (Khmer & English supported), widget: markdown }

  - name: services
    label: Services
    label_singular: Service
    description: PATech's core engineering service categories displayed on the landing page and services page.
    folder: /src/content/services
    identifier_field: slug
    summary: "{{number}} · {{title}}"
    create: true
    delete: true
    media_folder: /public/uploads/services
    public_folder: /uploads/services
    fields:
      - { name: number, label: Display Number, widget: string, hint: "Two digits, e.g. 01, 02, 03" }
      - { name: title, label: Full Service Name, widget: string }
      - { name: shortTitle, label: Card Title, widget: string }
      - { name: slug, label: URL Slug, widget: string }
      - { name: summary, label: Short Card Summary (2 lines), widget: text }
      - { name: coverImage, label: Card Photo, widget: image }
      - { name: coverImageAlt, label: Card Photo Alt, widget: string }
      - name: highlights
        label: Key Solutions Included
        widget: list
        required: false
      - name: benefits
        label: Why It Matters (Benefits)
        widget: list
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text }
      - name: workflow
        label: Engineering Delivery Flow (Steps)
        widget: list
        required: false
        fields:
          - { name: step, label: Step Number, widget: string }
          - { name: title, label: Step Title, widget: string }
          - { name: description, label: Step Description, widget: text }
      - name: solutions
        label: Detailed Solutions Catalog
        widget: list
        required: false
        fields:
          - { name: title, label: Solution Title, widget: string }
          - { name: category, label: Group / Category, widget: string, required: false }
          - { name: summary, label: Short Summary, widget: text }
          - { name: problem, label: Problem Solved, widget: text, required: false }
          - { name: applications, label: Typical Applications, widget: text, required: false }
          - { name: benefits, label: Key Benefits, widget: text, required: false }
          - { name: image, label: Solution Image, widget: image, required: false }
      - { name: featured, label: Show in Landing Page Trio, widget: boolean, default: true }
      - { name: draft, label: Keep as Draft, widget: boolean, default: false }
      - { name: body, label: Full Description & Solutions, widget: markdown }

  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    description: Client reviews shown in the Testimonials carousel.
    folder: /src/content/testimonials
    identifier_field: slug
    summary: "{{name}} · {{projectType}}"
    create: true
    delete: true
    fields:
      - { name: name, label: Client Name / Title, widget: string }
      - { name: slug, label: Identifier Slug, widget: string }
      - { name: role, label: Role, widget: string }
      - { name: projectType, label: Project Type / Facility, widget: string }
      - { name: quote, label: Review Quote, widget: text }
      - { name: rating, label: Star Rating (1-5), widget: number, value_type: int, min: 1, max: 5, default: 5 }
      - { name: avatar, label: Avatar Image, widget: image }
      - { name: highlight, label: Highlight Chip in Yellow, widget: boolean, default: false }
      - { name: sortOrder, label: Display Order, widget: number, value_type: int, min: 1, step: 1, default: 1 }
